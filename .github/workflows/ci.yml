name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build workspace
        id: build
        shell: bash
        run: |
          set +e
          cargo build --workspace --message-format=short > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "cargo exit code: $code"
          # surface error lines as annotations
          grep -E "error\[|error:" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          set +e
          echo "=== build.log tail (as annotations) ==="
          tail -100 build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: Test workspace
        id: test
        shell: bash
        run: |
          set +e
          cargo test --workspace > test.log 2>&1
          code=$?
          echo "test_exit=$code" >> "$GITHUB_OUTPUT"
          echo "cargo test exit code: $code"
          # surface compiler errors and failing tests as annotations
          grep -E "error\[|error:|^---- |panicked at|test result:|could not compile" test.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          # if nothing matched, dump the whole log
          if ! grep -qE "error\[|error:|could not compile" test.log; then
            cat test.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit 0

      - name: Fail if test failed
        if: steps.test.outputs.test_exit != '0'
        shell: bash
        run: |
          set +e
          echo "=== test.log tail (as annotations) ==="
          tail -80 test.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --message-format=short -- -D warnings > clippy.log 2>&1
          code=$?
          echo "clippy_exit=$code" >> "$GITHUB_OUTPUT"
          echo "cargo clippy exit code: $code"
          # short format: one error per line — surface every line containing a
          # crate path or a warning/error marker
          grep -E "crates\\\\|warning:|error" clippy.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

      - name: Fail if clippy failed
        if: steps.clippy.outputs.clippy_exit != '0'
        shell: bash
        run: |
          set +e
          echo "=== clippy.log tail (as annotations) ==="
          tail -80 clippy.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ${{ github.workspace }}/test.log

      - name: Upload clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: ${{ github.workspace }}/clippy.log
