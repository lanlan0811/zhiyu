name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build workspace (log errors to annotations)
        id: build
        shell: bash
        run: |
          set -o pipefail
          cargo build --workspace --message-format=short 2>&1 | tee /tmp/build.log | grep -E "error|warning: unused|warning: " || true
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # surface each error line as a github annotation so it appears in check-run annotations
          grep -E "^error" /tmp/build.log | head -40 | while IFS= read -r line; do
            echo "::error file=ci.yml::$line"
          done
          exit 0

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "=== last 100 lines of build log ==="
          tail -100 /tmp/build.log
          exit 1

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: D:\a\zhiyu\zhiyu\build.log
