name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build the web frontend first so Tauri's frontendDist exists
      # before any cargo step that embeds it.
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build workspace
        id: build
        shell: bash
        run: |
          cargo build --workspace > /tmp/build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show build result
        if: always()
        shell: bash
        run: |
          code="${{ steps.build.outputs.exit_code }}"
          echo "cargo build exit code: $code"
          if [ "$code" != "0" ]; then
            tail -80 /tmp/build.log
          fi

      - name: Fail if build failed
        if: always() && steps.build.outputs.exit_code != '0'
        shell: bash
        run: exit 1

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
