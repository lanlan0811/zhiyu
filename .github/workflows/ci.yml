name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build workspace
        id: build
        shell: bash
        run: |
          set +e
          cargo build --workspace --message-format=short > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "cargo exit code: $code"
          # surface error lines as annotations
          grep -E "error\[|error:" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          set +e
          echo "=== build.log tail (as annotations) ==="
          tail -100 build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: Test workspace
        id: test
        shell: bash
        run: |
          set +e
          cargo test --workspace > test.log 2>&1
          code=$?
          echo "test_exit=$code" >> "$GITHUB_OUTPUT"
          # surface failing test names and assertion messages as annotations
          grep -E "^---- |^test .* FAILED|panicked at|assertion|FAILED|failures:" test.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

      - name: Fail if test failed
        if: steps.test.outputs.test_exit != '0'
        shell: bash
        run: |
          set +e
          tail -120 test.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
