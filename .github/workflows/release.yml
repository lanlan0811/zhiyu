name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build release
        run: cargo build --release --workspace

      - name: Build tauri app (release)
        id: tauri
        shell: bash
        run: |
          set +e
          # -j2 limits parallel rustc jobs to avoid CI runner OOM during the
          # heavy tauri dependency chain (wry/tauri-runtime/softbuffer).
          cargo build -j2 --release --manifest-path src-tauri/Cargo.toml > tauri-build.log 2>&1
          code=$?
          echo "tauri_exit=$code" >> "$GITHUB_OUTPUT"
          echo "cargo tauri release build exit code: $code"
          echo "=== error lines ==="
          grep -nE "error|panicked|failed|cannot find|unresolved" tauri-build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "=== tauri-build.log tail ==="
          tail -100 tauri-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

      - name: Fail if tauri build failed
        if: steps.tauri.outputs.tauri_exit != '0'
        shell: bash
        run: |
          set +e
          echo "=== tauri-build.log tail (as annotations) ==="
          tail -80 tauri-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: Upload tauri build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: ${{ github.workspace }}/tauri-build.log

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_BUILD_JOBS: "2"
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: '知屿 Zhīyǔ ${{ github.ref_name }}'
          releaseBody: '自动生成的 Windows 发行包'
          releaseDraft: true
