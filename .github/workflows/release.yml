name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build release
        run: cargo build --release --workspace

      - name: Build tauri app (release)
        id: tauri
        shell: bash
        run: |
          set +e
          # -j2 limits parallel rustc jobs to avoid CI runner OOM during the
          # heavy tauri dependency chain (wry/tauri-runtime/softbuffer).
          cargo build -j2 --release --manifest-path src-tauri/Cargo.toml > tauri-build.log 2>&1
          code=$?
          echo "tauri_exit=$code" >> "$GITHUB_OUTPUT"
          echo "cargo tauri release build exit code: $code"
          # emit the build-script failure block as ONE annotation (GitHub caps
          # the number of annotations per step, so a single %0A-joined message
          # survives)
          BLOCK=$(awk '/failed to run custom build command/{found=1} found{print; if(++c>45) exit}' tauri-build.log)
          if [ -n "$BLOCK" ]; then
            ENC=$(printf '%s' "$BLOCK" | sed 's/%/%25/g; s/\r$//' | awk '{printf "%s%%0A", $0}')
            echo "::error::TAURI_BUILD_SCRIPT_FAILURE%0A${ENC}END"
          fi
          exit 0

      - name: Fail if tauri build failed
        if: steps.tauri.outputs.tauri_exit != '0'
        shell: bash
        run: |
          echo "tauri build failed — see the TAURI_BUILD_SCRIPT_FAILURE annotation above"
          exit 1

      - name: Upload tauri build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: ${{ github.workspace }}/tauri-build.log

      # Bundle NSIS + MSI installers directly with the @tauri-apps/cli (installed
      # as a web devDependency). tauri-action@v0 is avoided: it fails instantly
      # on the Node 24 runtime GitHub now forces onto older actions.
      - name: Bundle tauri app (nsis + msi)
        id: bundle
        shell: bash
        run: |
          set +e
          npm --prefix web run tauri -- build > tauri-bundle.log 2>&1
          code=$?
          echo "bundle_exit=$code" >> "$GITHUB_OUTPUT"
          echo "tauri bundle exit code: $code"
          BLOCK=$(grep -E "error|failed|Error|panicked" tauri-bundle.log | head -40)
          if [ -n "$BLOCK" ]; then
            ENC=$(printf '%s' "$BLOCK" | sed 's/%/%25/g; s/\r$//' | awk '{printf "%s%%0A", $0}')
            echo "::error::TAURI_BUNDLE_FAILURE%0A${ENC}END"
          fi
          exit 0

      - name: Fail if bundle failed
        if: steps.bundle.outputs.bundle_exit != '0'
        shell: bash
        run: |
          echo "tauri bundle failed — see the TAURI_BUNDLE_FAILURE annotation above"
          tail -80 tauri-bundle.log
          exit 1

      - name: Upload bundle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-log
          path: ${{ github.workspace }}/tauri-bundle.log

      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: '知屿 Zhīyǔ ${{ github.ref_name }}'
          body: '自动生成的 Windows 发行包（NSIS + MSI，未签名）'
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
