[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/driver",
    "crates/context",
    "crates/core",
    "crates/browser",
    "crates/daemon",
]
default-members = [
    "crates/protocol",
    "crates/driver",
    "crates/context",
    "crates/core",
    "crates/browser",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lanlan0811/zhiyu"
authors = ["知屿 Zhīyǔ contributors"]
description = "知屿 Zhīyǔ — a pure-local, dual-mode (daily / coding) harness desktop app for local AI agents."

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
glob = "0.3"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
dirs = "5"
percent-encoding = "2"
async-trait = "0.1"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
