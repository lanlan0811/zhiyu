[package]
name = "zhiyu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core engine for 知屿 Zhīyǔ: sessions, persistence, workspaces, git checkpoints, skills and knowledge base."

[features]
# Real local embeddings via fastembed (onnxruntime). Off by default; the
# hashed embedder keeps the minimal build and CI fast.
fastembed = ["dep:fastembed"]

[dependencies]
zhiyu-protocol = { path = "../protocol" }
zhiyu-context = { path = "../context" }
zhiyu-driver = { path = "../driver" }
base64.workspace = true
dirs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
glob.workspace = true
tracing.workspace = true
anyhow.workspace = true
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
fastembed = { version = "4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true
